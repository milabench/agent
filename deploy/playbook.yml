---
- name: Deploy Milabench Agent
  hosts: all
  become: true
  vars_files:
    - group_vars/all.yml

  tasks:
    - name: Update package manager cache
      apt:
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Install system dependencies
      apt:
        name:
          - python{{ python_version }}
          - python{{ python_version }}-dev
          - git
          - build-essential
          - libssl-dev
          - libffi-dev
          - curl
        state: present
      when: ansible_os_family == "Debian"

    - name: Create milabench group
      become: true
      group:
        name: "{{ agent_group }}"
        state: present
      when: agent_user != ansible_user_id

    # - name: Create milabench user
    #   user:
    #     name: "{{ agent_user }}"
    #     group: "{{ agent_group }}"
    #     home: "{{ milabench_base }}"
    #     shell: /bin/bash
    #     createhome: yes
    #     state: present
    #   when: agent_user != ansible_user_id

    # - name: Configure passwordless sudo for agent user
    #   lineinfile:
    #     path: /etc/sudoers.d/{{ agent_user }}
    #     line: "{{ agent_user }} ALL=(ALL) NOPASSWD:ALL"
    #     create: yes
    #     state: present
    #     mode: '0440'
    #     validate: /usr/sbin/visudo -cf %s
    #   when: agent_user != ansible_user_id

    - name: Create base directory structure
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ agent_user }}"
        group: "{{ agent_group }}"
        mode: '0755'
      loop:
        - "{{ milabench_base }}"
        - "{{ agent_install_dir }}"
        - "{{ agent_job_dir }}"
        - "{{ agent_log_dir }}"

    - name: Install UV package manager as service user
      become_user: "{{ agent_user }}"
      shell: |
        export HOME={{ milabench_base }}
        export PATH="$HOME/.local/bin:$PATH"
        curl -LsSf https://astral.sh/uv/install.sh | sh
      args:
        executable: /bin/bash
        creates: "{{ milabench_base }}/.local/bin/uv"
      register: uv_install
      changed_when: "('Installed uv' in (uv_install.stdout | default(''))) or ('uv already installed' not in (uv_install.stdout | default('')))"

    - name: Clone agent repository
      git:
        repo: "{{ agent_repo_url }}"
        dest: "{{ agent_install_dir }}"
        version: "{{ agent_repo_branch }}"
        update: yes
      become_user: "{{ agent_user }}"
      register: agent_clone

    - name: Create Python virtual environment with UV
      shell: |
        export PATH="$HOME/.local/bin:$PATH"
        uv venv {{ agent_venv_dir }} --python python{{ python_version }}
      become_user: "{{ agent_user }}"
      args:
        executable: /bin/bash
        creates: "{{ agent_venv_dir }}/bin/python"
      environment:
        HOME: "{{ milabench_base }}"

    - name: Install agent package and dependencies with UV
      shell: |
        uv pip install -e {{ agent_install_dir }}
      become_user: "{{ agent_user }}"
      args:
        executable: /bin/bash
      environment:
        UV_PYTHON: "{{ agent_venv_dir }}/bin/python"
        HOME: "{{ milabench_base }}"

    - name: Create systemd service file
      template:
        src: milabench-agent.service.j2
        dest: /etc/systemd/system/{{ agent_service_name }}.service
        owner: root
        group: root
        mode: '0644'
      notify: Reload systemd daemon

    - name: Create environment file for service
      template:
        src: agent.env.j2
        dest: "{{ milabench_base }}/.env"
        owner: "{{ agent_user }}"
        group: "{{ agent_group }}"
        mode: '0600'

    - name: Create configuration file
      template:
        src: agent.conf.j2
        dest: "{{ milabench_base }}/agent.conf"
        owner: "{{ agent_user }}"
        group: "{{ agent_group }}"
        mode: '0600'

    - name: Set permissions on job directory
      file:
        path: "{{ agent_job_dir }}"
        owner: "{{ agent_user }}"
        group: "{{ agent_group }}"
        mode: '0755'
        recurse: yes

    - name: Enable agent service
      systemd:
        name: "{{ agent_service_name }}"
        enabled: yes
        daemon_reload: yes

    - name: Start agent service
      systemd:
        name: "{{ agent_service_name }}"
        state: started

  handlers:
    - name: Reload systemd daemon
      command: systemctl daemon-reload
