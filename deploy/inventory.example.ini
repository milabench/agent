# Example Ansible Inventory for Milabench Agent Deployment
# Copy this to your deployment location and customize with your hosts

[agent_servers]
# Single agent
agent1.example.com

# Multiple agents
# agent2.example.com
# agent3.example.com
# agent-gpu.internal
# agent-cpu.internal

[agent_servers:vars]
# SSH connection details
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_become_method=sudo

# Optional: custom configuration per group
# milabench_base=/opt/milabench
# agent_job_dir=/data/jobrunner
# agent_server_port=5000

[all:vars]
# Global variables can be set here
ansible_python_interpreter=/usr/bin/python3
